syntax = "proto3";

package xray.proxy.freedom;
option csharp_namespace = "Xray.Proxy.Freedom";
option go_package = "github.com/xtls/xray-core/proxy/freedom";
option java_package = "com.xray.proxy.freedom";
option java_multiple_files = true;

import "common/protocol/server_spec.proto";
import "transport/internet/config.proto";
import "common/net/port.proto";
import "common/net/network.proto";
import "common/geodata/geodat.proto";

message DestinationOverride {
  xray.common.protocol.ServerEndpoint server = 1;
}

message Fragment {
  uint64 packets_from = 1;
  uint64 packets_to = 2;
  uint64 length_min = 3;
  uint64 length_max = 4;
  uint64 interval_min = 5;
  uint64 interval_max = 6;
  uint64 max_split_min = 7;
  uint64 max_split_max = 8;
}

message Noise {
  uint64 length_min = 1;
  uint64 length_max = 2;
  uint64 delay_min = 3;
  uint64 delay_max = 4;
  bytes packet = 5;
  string apply_to = 6;
}

message Range {
  uint64 min = 1;
  uint64 max = 2;
}

enum RuleAction {
  Allow = 0;
  Block = 1;
}

message FinalRuleConfig {
  RuleAction action = 1;
  repeated xray.common.net.Network networks = 2;
  xray.common.net.PortList port_list = 3;
  repeated xray.common.geodata.IPRule ip = 4;
  Range block_delay = 5;
}


message UDPConfig {
  bool enable_socket_pool = 1;
  bool enable_sticky_resolver = 2;
  bool prefer_ipv4 = 3;
  bool prefer_ipv6 = 4;
  uint32 session_idle_timeout = 5;
  uint32 pool_staleness_timeout = 6;
  uint32 pool_idle_timeout = 7;
  uint32 pool_unused_timeout = 8;
  // v26.10.34-link (C4 fix): proto binding for stickyResolverTtl JSON field.
  uint32 sticky_resolver_ttl = 9;
  // v26.10.44-link: TCP warm-pool. When a TCP connection's inbound
  // side closes but the outbound is still alive, the outbound is
  // placed in a warm pool for reuse by the next inbound to the same
  // destination. Eliminates TCP+TLS handshake for repeated connections
  // to the same destination (e.g. YouTube segment fetches through WG).
  bool enable_tcp_warm_pool = 10;
  uint32 tcp_warm_pool_timeout = 11;
  // v26.10.45-link: auto pre-warming. The pool tracks which destinations
  // are frequently accessed and pre-establishes TCP connections for the
  // top N, so the first visit to a frequently-used site has zero TCP
  // handshake latency. 0 disables pre-warming.
  uint32 pre_warm_count = 12;
  // v26.10.46-link: per-wildcard first-N learning. Smarter than
  // preWarmCount: learns the critical-path IPs (the first N IPs
  // the browser hits on each visit) instead of the most-frequent
  // IPs (which includes analytics/tracking that fire after page load).
  // After learnVisits visits, the pattern stabilizes and those
  // specific IPs are pre-warmed every 60s. More efficient: 5 per
  // site family instead of 20 globally.
  uint32 pre_warm_first_n = 13;
  uint32 pre_warm_learn_visits = 14;
}

message Config {
  xray.transport.internet.DomainStrategy domain_strategy = 1;
  DestinationOverride destination_override = 3;
  uint32 user_level = 4;
  Fragment fragment = 5;
  uint32 proxy_protocol = 6;
  repeated Noise noises = 7;
  repeated FinalRuleConfig final_rules = 8;
  UDPConfig udp_config = 9;
}
